<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>L'Arbre — le monde</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/atelier.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="chargement" class="chargement">🌳 Création du monde…</div>

  <aside class="panneau" aria-label="Le monde">
    <h1>Le monde de l'Arbre</h1>
    <p class="sous">Une personne = une grande feuille. Touche une feuille pour y emmener la boule.</p>

    <div class="groupe">
      <h2>Boule</h2>
      <div class="boutons">
        <button id="btn-moi" class="principal">🍃 Ma feuille</button>
        <button id="btn-capitale">🏛 Capitale</button>
        <button id="btn-hasard">🎲 Une feuille</button>
        <button id="btn-suivre" class="actif">🎥 Suivre</button>
        <button id="btn-arbre">🌳 Vue d’ensemble</button>
      </div>
    </div>

    <div class="groupe">
      <h2>Arrivées simulées</h2>
      <div class="boutons">
        <button data-arrivee="1">+ 1</button>
        <button data-arrivee="5">+ 5</button>
        <button data-arrivee="20">+ 20</button>
        <button id="btn-auto">▶ Auto</button>
        <button id="btn-reset">↺ Recommencer</button>
      </div>
    </div>

    <dl class="stats">
      <dt>Personnes</dt><dd id="stat-nombre">—</dd>
      <dt>Branches</dt><dd id="stat-branches">—</dd>
      <dt>Feuilles / branche</dt><dd id="stat-detail">—</dd>
      <dt>La boule est</dt><dd id="stat-lieu">—</dd>
    </dl>
  </aside>

  <div id="toasts"></div>
  <script type="module" src="./js/monde/main.js"></script>
</body>
</html>
