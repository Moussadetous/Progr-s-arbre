<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>L'Arbre — atelier du monde</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/atelier.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="etiquette-moi" class="etiquette">🍃 Léa · ma maison</div>
  <div id="chargement" class="chargement">🌳 Création du monde…</div>

  <aside class="panneau" aria-label="Atelier du monde">
    <h1>Atelier du monde</h1>
    <p class="sous">Un tronc, quatre grosses branches, une maison. Les arrivées sont simulées.</p>

    <div class="groupe">
      <h2>Vues</h2>
      <div class="boutons">
        <button data-vue="lointaine">🌅 Lointaine</button>
        <button data-vue="maison">🏡 Ma maison</button>
        <button data-vue="interieur">🛏 Intérieur</button>
        <button data-vue="branche">🌿 Branche</button>
        <button data-vue="dessus">🧭 Dessus</button>
      </div>
    </div>

    <div class="groupe">
      <h2>Arrivées</h2>
      <div class="boutons">
        <button class="principal" data-arrivee="1">+ 1</button>
        <button data-arrivee="5">+ 5</button>
        <button data-arrivee="10">+ 10</button>
        <button id="btn-auto">▶ Arrivées auto</button>
      </div>
      <div class="boutons">
        <button id="btn-zones">🟢 Emplacements</button>
        <button id="btn-reset">↺ Recommencer</button>
      </div>
    </div>

    <dl class="stats">
      <dt>Maisons</dt><dd id="stat-nombre">—</dd>
      <dt>Par branche</dt><dd id="stat-branches">—</dd>
      <dt>Plus petit écart</dt><dd id="stat-espace">—</dd>
      <dt>État</dt><dd id="stat-etat">—</dd>
    </dl>
  </aside>

  <div id="toasts"></div>
  <script type="module" src="./js/atelier/main.js"></script>
</body>
</html>
